name = "quiz-funnel-app"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Static funnel + dashboard assets served by the Worker.
[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Worker runs first for every request: path-based routing means funnel slugs
# (e.g. /drapatricia) must hit the Worker so it can inject funnel config.
run_worker_first = true

[[kv_namespaces]]
binding = "QUIZ_CRM"
id = "d96ceb3619b94fdfa7b0685b407a7ea7"
preview_id = "35b62c4618d2452a9f4364b2596bfadd"

[[d1_databases]]
binding = "DB"
database_name = "quiz-funnel-crm"
database_id = "e59571a7-af41-4e9c-9106-51ffebbd1035"

# AI Ads add-on: stores generated ad creative images (served via /api/ai/creatives/:id/image).
[[r2_buckets]]
binding = "AD_ASSETS"
bucket_name = "quiz-funnel-ad-assets"

[vars]
ENVIRONMENT = "production"
# Platform host: landing at "/", dashboard at "/admin", funnels at "/<slug>".
# This stays the single canonical host — public funnel links are
# offers.clubemkt.digital/<slug>. Vanity hosts like funnels.tektone.com.br are
# handled as edge 301 redirects in their own zone, NOT as platform hosts here
# (so they never generate funnel links under their own domain).
PLATFORM_DOMAIN = "offers.clubemkt.digital"
# Additional hosts that behave identically (path-based), comma-separated. Empty:
# the Worker is reachable only via offers.clubemkt.digital.
PLATFORM_DOMAINS = ""
# Cloudflare for SaaS (Phase 2 — customers' own domains). Customers CNAME to the
# platform host; activation also needs the CF_API_TOKEN secret + SAAS_ZONE_ID.
SAAS_ZONE_ID = ""                              # clubemkt.digital zone id (set when activating Phase 2)
SAAS_CNAME_TARGET = "offers.clubemkt.digital"  # CNAME target customers point their domain at
# CF_API_TOKEN is a secret: wrangler secret put CF_API_TOKEN  (Custom Hostnames edit scope)

# AI Ads add-on
META_GRAPH_VERSION = "v21.0"                    # Meta Graph API version for the Ad Library
AI_ALLOW_SELF_GRANT = "1"                       # lets the "Unlock AI Ads" button grant test credits (set "0" once Stripe checkout ships)
AI_BILLING_CURRENCY = "eur"                     # currency for AI Ads credit-pack checkout (minor units in credits.js AI_PACKS)

# Messaging / deliverables (lead-magnet mailer)
MAIL_FROM_DEFAULT = "Tektone Funnels <noreply@mail.clubemkt.digital>"  # verified Resend sender

# Attach the Worker to the platform host as a Custom Domain (wrangler creates the
# proxied DNS record + edge cert for this single hostname automatically).
[[routes]]
pattern = "offers.clubemkt.digital"
custom_domain = true

# funnels.tektone.com.br is added via Cloudflare for SaaS (Custom Hostname on the
# clubemkt.digital zone with fallback origin = offers.clubemkt.digital), NOT a
# Workers route — the tektone.com.br zone is in a different account (TEKTONE) than
# this Worker (ClubeMKT). The Worker treats the host as a platform host via
# PLATFORM_DOMAINS above, so /<slug> routing works once SaaS forwards the request.

# Secrets (set via: wrangler secret put NAME):
#   SECRETS_KEY      — base64 32-byte AES key for encrypting tenant Stripe keys
#   ANTHROPIC_API_KEY — AI Ads: strategy + copy generation (Claude)
#   OPENAI_API_KEY    — AI Ads: image creatives (gpt-image-1)
#   META_ADS_TOKEN    — AI Ads: Meta Ad Library access token (ads_archive)
#   AI_STRIPE_SECRET_KEY     — AI Ads billing: platform's own Stripe secret (sells credit packs)
#   AI_STRIPE_WEBHOOK_SECRET — AI Ads billing: signing secret for /api/public/ai-webhook
#                              (Stripe webhook endpoint → checkout.session.completed)
#   RESEND_API_KEY    — Mailer: deliverable emails (verify mail.clubemkt.digital in Resend)
#   WHATSAPP_TOKEN / WHATSAPP_PHONE_ID       — (future) WhatsApp Cloud API channel
#   INSTAGRAM_TOKEN / INSTAGRAM_IG_ID        — (future) Instagram Messaging channel
