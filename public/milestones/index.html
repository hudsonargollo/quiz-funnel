<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Progresso · FunnelTone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* ============================================================================
   Same token system as public/home/index.html — kept in lockstep on purpose
   so the internal milestones pages read as the same product as the landing.
   ========================================================================== */
:root{
  --cyan-300:#7ad9ff; --cyan-400:#36c4ff; --cyan-500:#00aeef; --cyan-600:#0090d4; --cyan-700:#0a6ea3;
  --violet-300:#c4b5ff; --violet-400:#9d83ff; --violet-500:#7c5cff; --violet-600:#6243e6;

  --ink-950:#070a0f; --ink-900:#0b0f15; --ink-850:#0e131b; --ink-800:#121925; --ink-750:#172131;
  --ink-700:#1d2840; --line:#1e2a3d; --line-soft:#172234;

  --text:#eaf1f8; --text-2:#aab6c6; --text-3:#6f7d90; --on-brand:#04121b;

  --bg:var(--ink-950); --surface:var(--ink-900); --surface-2:var(--ink-850);
  --brand:var(--cyan-500); --brand-2:var(--cyan-300); --accent:var(--violet-500);
  --success:#22c55e; --danger:#f87171;

  --grad-brand:linear-gradient(135deg,var(--cyan-400),var(--violet-500));
  --grad-text:linear-gradient(120deg,#ffffff 10%,var(--cyan-300) 55%,var(--violet-300) 100%);
  --grad-surface:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0));
  --grad-line:linear-gradient(135deg,rgba(54,196,255,.5),rgba(124,92,255,.35),transparent);

  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px; --r-pill:999px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px; --s-8:64px; --s-9:96px;

  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 12px 30px -16px rgba(0,0,0,.7);
  --shadow-lg:0 40px 80px -32px rgba(0,0,0,.8);
  --glow:0 0 0 1px rgba(54,196,255,.15), 0 20px 60px -24px rgba(0,174,239,.45);

  --font-display:'Space Grotesk',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fs-h1:clamp(2rem,4.4vw,3.1rem);
  --fs-h2:clamp(1.6rem,3vw,2.3rem);
  --fs-h3:1.2rem;
  --fs-lead:clamp(1rem,1.5vw,1.15rem);

  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
::selection{background:rgba(124,92,255,.35)}

body::before{
  content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(900px 500px at 78% -8%,rgba(0,174,239,.14),transparent 60%),
    radial-gradient(800px 600px at 8% 8%,rgba(124,92,255,.10),transparent 55%),
    radial-gradient(700px 700px at 50% 120%,rgba(0,174,239,.07),transparent 60%);
}
body::after{
  content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.4;
  background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(1000px 700px at 50% -5%,#000,transparent 70%);
          mask-image:radial-gradient(1000px 700px at 50% -5%,#000,transparent 70%);
}

.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--font-display);line-height:1.1;letter-spacing:-.02em;font-weight:700}
.gradient-text{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);
  font-size:.76rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--brand-2);padding:6px 12px;border-radius:var(--r-pill);
  background:rgba(54,196,255,.08);border:1px solid rgba(54,196,255,.18);
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-display);font-weight:600;font-size:.92rem;padding:11px 18px;border-radius:var(--r-pill);border:1px solid transparent;cursor:pointer;transition:transform .15s var(--ease),box-shadow .25s var(--ease);white-space:nowrap}
.btn-primary{background:var(--grad-brand);color:#fff;box-shadow:var(--glow)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-primary:disabled{opacity:.45;cursor:default;transform:none}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--text);border-color:var(--line)}
.btn-ghost:hover{background:rgba(255,255,255,.08)}

/* ── Auth gate ── */
#authgate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.authcard{width:100%;max-width:380px;background:var(--surface);border-radius:var(--r-lg);padding:36px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.authcard::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--grad-line);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.authcard .logo{width:42px;height:42px;border-radius:12px;background:var(--grad-brand);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;color:#fff;margin-bottom:20px;box-shadow:0 6px 18px -6px rgba(0,174,239,.7)}
.authcard h1{font-size:1.55rem;margin:0 0 5px}
.authcard p.sub{color:var(--text-2);font-size:.86rem;margin:0 0 24px}
.authcard label{display:block;font-size:.76rem;color:var(--text-2);margin:16px 0 7px;font-weight:500}
.authcard .field{position:relative}
.authcard .field>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;transition:color .2s}
.authcard .field:focus-within>svg{color:var(--brand-2)}
.authcard input{width:100%;padding:12px 14px 12px 42px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-size:14px;font-family:inherit;transition:border-color .2s,box-shadow .2s}
.authcard input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(54,196,255,.12)}
.authcard input::placeholder{color:var(--text-3)}
.authcard .pw-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-3);width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:color .2s,background .2s}
.authcard .pw-toggle svg{display:block}
.authcard .pw-toggle:hover{color:var(--text);background:rgba(255,255,255,.06)}
.authcard .btn{width:100%;margin-top:26px}
.authcard .btn .spin-sm{width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.autherr{color:var(--danger);font-size:.78rem;margin-top:10px;min-height:16px}

/* ── Nav ── */
header.nav{position:sticky;top:0;z-index:50}
.nav-inner{margin:12px auto;max-width:1160px;display:flex;align-items:center;gap:14px;padding:9px 14px 9px 16px;border-radius:var(--r-pill);background:rgba(11,15,21,.72);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:var(--shadow-md)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:.98rem}
.logo{width:30px;height:30px;border-radius:9px;background:var(--grad-brand);display:grid;place-items:center;color:#fff;font-weight:700;font-size:.95rem;box-shadow:0 6px 18px -6px rgba(0,174,239,.7)}
.brand .sep{color:var(--text-3);font-weight:400;font-size:.85em}
.spacer{flex:1}
.whoami{font-size:.78rem;color:var(--text-3);display:flex;align-items:center}
.role-badge{display:inline-block;padding:2px 9px;border-radius:var(--r-pill);font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-left:7px}
.role-badge.admin{background:rgba(54,196,255,.14);color:var(--cyan-300)}
.role-badge.viewer{background:rgba(124,92,255,.16);color:var(--violet-300)}
.navlink{font-size:.85rem;color:var(--text-2);padding:8px 10px}
.navlink:hover{color:var(--text)}
@media(max-width:640px){.whoami{display:none}}
@media(max-width:480px){
  .nav-inner{gap:8px;padding:8px 10px}
  .brand{gap:8px}
  .brand .sep{display:none}
  .navlink{padding:8px 6px;font-size:.78rem}
  #signout-btn{padding:9px 13px;font-size:.82rem}
}
@media(max-width:360px){
  .brand .wordmark{display:none}
}

.sec{padding:40px 0}
.sec:first-of-type{padding-top:12px}
.sec-head{margin:0 0 28px}
.sec-head h1,.sec-head h2{font-size:var(--fs-h2);margin-top:12px}
.sec-head p{color:var(--text-2);font-size:1.02rem;margin-top:10px;max-width:60ch}

/* ── Overview: overall progress band ── */
.band{display:flex;align-items:center;gap:22px;padding:24px 28px;border-radius:var(--r-xl);background:linear-gradient(135deg,rgba(0,174,239,.08),rgba(124,92,255,.06)),var(--surface);border:1px solid var(--line)}
.band .bignum{font-family:var(--font-display);font-size:clamp(2.2rem,5vw,3rem);font-weight:700}
.band .bandbar{flex:1;min-width:0}
.band .bandmeta{font-size:.85rem;color:var(--text-2);white-space:nowrap}
@media(max-width:460px){.band{flex-wrap:wrap;padding:20px}.band .bandbar{flex:1 1 100%;order:1}}
.pbar{height:8px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.pbar>div{height:100%;background:var(--grad-brand);border-radius:var(--r-pill);transition:width .6s var(--ease)}
.pbar.done>div{background:var(--success)}

/* ── Stat tiles (overview) ── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:14px}
.stat-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px}
.stat-tile .ico{width:34px;height:34px;border-radius:10px;background:rgba(54,196,255,.1);border:1px solid rgba(54,196,255,.22);display:grid;place-items:center;color:var(--brand-2);margin-bottom:10px}
.stat-tile .num{font-family:var(--font-display);font-size:1.6rem;font-weight:700}
.stat-tile .lbl{font-size:.78rem;color:var(--text-2);margin-top:2px}

/* ── Milestone cards ── */
.cards{display:grid;grid-template-columns:1fr;gap:16px;margin-top:var(--s-6)}
@media(min-width:680px){.cards{grid-template-columns:1fr 1fr}}
.card-link{position:relative;display:block;background:var(--grad-surface),var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;overflow:hidden;transition:transform .3s var(--ease),border-color .3s}
.card-link:hover{transform:translateY(-4px);border-color:rgba(54,196,255,.4)}
.card-link::after{content:'';position:absolute;inset:0;background:radial-gradient(360px 200px at 50% -20%,rgba(54,196,255,.12),transparent 70%);opacity:0;transition:opacity .3s}
.card-link:hover::after{opacity:1}
.card-link.done{border-color:rgba(34,197,94,.3)}
.card-link.done:hover{border-color:rgba(34,197,94,.55)}
.card-link.done::after{background:radial-gradient(360px 200px at 50% -20%,rgba(34,197,94,.14),transparent 70%)}
.card-link.done .card-ico{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.3);color:var(--success)}
.done-ribbon{position:absolute;top:14px;right:14px;z-index:1;display:flex;align-items:center;gap:5px;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--success);background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.28);padding:4px 9px;border-radius:var(--r-pill)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-num{font-family:var(--font-display);font-size:1.7rem;font-weight:700;background:var(--grad-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.card-ico{width:38px;height:38px;border-radius:11px;background:rgba(54,196,255,.1);border:1px solid rgba(54,196,255,.22);display:grid;place-items:center;color:var(--brand-2)}
.card-title{font-size:var(--fs-h3);margin-bottom:8px}
.card-timeline{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--text-2);margin-bottom:16px}
.pmeta{display:flex;justify-content:space-between;font-size:.76rem;color:var(--text-3);margin-top:8px}
.ppct{font-weight:700;color:var(--brand-2)}

/* ── Schedule (8-week macro) ── */
.sched{display:flex;flex-direction:column;gap:14px;margin-top:var(--s-6)}
.sched-row{position:relative;display:grid;grid-template-columns:minmax(84px,auto) minmax(0,1fr);gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px;min-width:0}
.sched-row .wk{font-family:var(--font-display);font-weight:700;font-size:.94rem;background:var(--grad-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sched-row .wk small{display:block;margin-top:3px;font-family:var(--font-body);font-weight:500;font-size:.68rem;color:var(--text-3);-webkit-text-fill-color:var(--text-3)}
.sched-body{min-width:0}
.sched-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sched-focus{font-size:var(--fs-h3);font-family:var(--font-display);font-weight:700;min-width:0}
.sched-chip{font-size:.72rem;font-weight:600;color:var(--cyan-300);background:rgba(54,196,255,.09);border:1px solid rgba(54,196,255,.2);padding:4px 10px;border-radius:var(--r-pill);white-space:nowrap;flex-shrink:0}
.sched-milestone{font-size:.88rem;color:var(--text-2);margin-bottom:10px}
.sched-details{display:flex;flex-direction:column;gap:7px}
.sched-details div{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;font-size:.82rem;color:var(--text-3)}
.sched-details .dtxt{display:flex;align-items:flex-start;gap:8px;min-width:0}
.sched-details svg{flex-shrink:0;margin-top:3px;color:var(--brand-2)}
.sched-details .ddate{flex-shrink:0;font-size:.72rem;font-weight:600;color:var(--brand-2);white-space:nowrap;background:rgba(54,196,255,.07);border:1px solid rgba(54,196,255,.16);padding:2px 8px;border-radius:var(--r-pill)}
@media(max-width:680px){.sched-row{grid-template-columns:1fr}.sched-details div{flex-direction:column;gap:4px}}

/* ── Detail hero ── */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);overflow:hidden;position:relative}
.hero::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--grad-line);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.hero-grad{padding:32px 30px;background:radial-gradient(700px 320px at 15% -30%,rgba(0,174,239,.16),transparent 70%)}
.hero .badge{margin-bottom:16px}
.hero h1{font-size:var(--fs-h1);margin:0 0 18px;line-height:1.12}
.infogrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.infogrid{grid-template-columns:1fr 1fr}}
.infobox{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}
.infobox .lbl{display:flex;align-items:center;gap:6px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--brand-2);margin-bottom:5px}
.infobox .val{font-size:.88rem;color:var(--text-2);line-height:1.5}
.hero.done{border-color:rgba(34,197,94,.22)}
.hero-progress{padding:20px 30px;border-top:1px solid var(--line);display:flex;align-items:center;gap:18px}
.ring-pct{font-family:var(--font-display);font-size:1.9rem;font-weight:700;background:var(--grad-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;min-width:66px}
.ring-pct.done{background:none;-webkit-text-fill-color:var(--success);color:var(--success)}
.hero-progress .pbar{flex:1}
.hero-progress .count{font-size:.8rem;color:var(--text-3);white-space:nowrap}

/* ── Task categories ── */
.cat{margin-top:30px}
.cat h3{font-size:.92rem;font-weight:600;color:var(--text);border-bottom:1px solid var(--line);padding-bottom:11px;margin:0 0 10px;font-family:var(--font-display)}
.task{display:flex;align-items:flex-start;gap:11px;padding:12px 13px;border-radius:var(--r-sm);border:1px solid transparent;margin-bottom:4px;transition:background .2s}
.task.done{background:rgba(34,197,94,.06);border-color:rgba(34,197,94,.18)}
.task:not(.done):hover{background:var(--surface-2)}
.task .chk{flex-shrink:0;width:19px;height:19px;margin-top:1px;color:var(--text-3)}
.task.done .chk{color:var(--success)}
.task.clickable{cursor:pointer}
.task p{margin:0;font-size:.92rem;color:var(--text)}
.task.done p{color:var(--text-3);text-decoration:line-through}

/* ── Deliverable ── */
.deliverable{margin-top:26px;background:var(--grad-surface),var(--surface);border:1px solid rgba(54,196,255,.22);border-radius:var(--r-lg);padding:20px 22px;display:flex;gap:15px;align-items:flex-start}
.deliverable svg{flex-shrink:0;color:var(--brand-2);margin-top:2px}
.deliverable h5{margin:0 0 5px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--brand-2);font-family:var(--font-display)}
.deliverable p{margin:0;font-size:.92rem;color:var(--text)}

/* ── Comments ── */
.comments{margin-top:36px}
.comments h3{display:flex;align-items:center;gap:8px;font-size:1.05rem;margin:0 0 18px}
.clist{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.cmt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}
.cmt-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:10px}
.cmt-author{font-size:.8rem;font-weight:700;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmt-date{font-size:.72rem;color:var(--text-3);white-space:nowrap}
.cmt-body{font-size:.87rem;color:var(--text-2);white-space:pre-wrap;line-height:1.55}
.cempty{font-size:.85rem;color:var(--text-3);padding:18px 0}
.cform textarea{width:100%;min-height:84px;resize:vertical;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:13px;color:var(--text);font-family:inherit;font-size:.87rem}
.cform textarea:focus{outline:none;border-color:var(--brand)}
.cform .row{display:flex;justify-content:flex-end;margin-top:10px}

/* ── Nav between milestones ── */
.mnav{display:flex;justify-content:space-between;margin-top:36px;gap:12px}
.mnav a{flex:1;display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 16px;font-size:.82rem;color:var(--text-2);transition:border-color .2s,color .2s}
.mnav a:hover{border-color:rgba(54,196,255,.35);color:var(--text)}
.mnav a.next{text-align:right}
.mnav a small{display:block;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;font-size:.66rem;margin-bottom:2px;font-family:var(--font-display)}

.spin{width:28px;height:28px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:80px auto}
@keyframes spin{to{transform:rotate(360deg)}}

.reveal{opacity:0;transform:translateY(20px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}

footer.foot{border-top:1px solid var(--line);margin-top:var(--s-9);padding:36px 0}
footer.foot p{text-align:center;color:var(--text-3);font-size:.82rem}
</style>
</head>
<body>

<div id="authgate" class="hidden">
  <div class="authcard">
    <div class="logo">F</div>
    <h1>Entrar</h1>
    <p class="sub">Acesse sua conta · FunnelTone</p>
    <label>Email</label>
    <div class="field">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
      <input id="au-email" type="email" autocomplete="username" placeholder="voce@tektone.com.br">
    </div>
    <label>Senha</label>
    <div class="field">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input id="au-pass" type="password" autocomplete="current-password" style="padding-right:42px">
      <button type="button" class="pw-toggle" id="au-pw-toggle" tabindex="-1" aria-label="Mostrar senha">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <button class="btn btn-primary" id="au-btn"><span id="au-btn-label">Entrar</span></button>
    <div class="autherr" id="au-err"></div>
  </div>
</div>

<div id="loading" class="spin"></div>

<div id="app" class="hidden">
  <header class="nav wrap">
    <nav class="nav-inner">
      <a class="brand" href="/milestones"><span class="logo">F</span><span class="wordmark">FunnelTone</span><span class="sep">/ Progresso</span></a>
      <div class="spacer"></div>
      <span class="whoami" id="whoami"></span>
      <a class="navlink hidden" id="dash-link" href="/admin">← Dashboard</a>
      <button class="btn btn-ghost" id="signout-btn">Sair</button>
    </nav>
  </header>
  <div class="wrap" id="content"></div>
  <footer class="foot wrap"><p>FunnelTone — acompanhamento de desenvolvimento</p></footer>
</div>

<script>
(function(){
  var slug = (location.pathname.replace(/\/+$/,'').split('/')[2]) || null;
  var STATE = { isAdmin:false, me:null, milestones:[] };

  // Sprint start: Sunday, June 28 2026 — each phase is a 2-week block, delivery
  // date per week is that week's last day (Saturday).
  var SCHEDULE = [
    { phase:'Fase 1', weeks:'Semanas 1-2', range:'28/06 – 11/07', focus:'Prioridade 1: Core Funcional (MVP)', milestone:'MVP funcional implantado internamente', slug:'milestone01',
      details:[
        { text:'Semana 1: Infraestrutura e Fundação (Auth, DB, Dashboard, Criação Flow)', date:'04/07' },
        { text:'Semana 2: Editor Visual e Entrega do MVP (Textos, Imagens, CTA, Tracking básico)', date:'11/07' },
      ] },
    { phase:'Fase 2', weeks:'Semanas 3-4', range:'12/07 – 25/07', focus:'Prioridade 2: Automação com IA', milestone:'Módulos de Copy e Criativos com IA ativos', slug:'milestone02',
      details:[
        { text:'Semana 3: Motor de Copywriting (LLM API, Prompts, Geração em 1 clique)', date:'18/07' },
        { text:'Semana 4: Geração de Criativos (10 variações, Biblioteca, Exportação)', date:'25/07' },
      ] },
    { phase:'Fase 3', weeks:'Semanas 5-6', range:'26/07 – 08/08', focus:'Prioridade 3: Mineração de Produtos', milestone:'Mineração interna e biblioteca de anúncios conectadas', slug:'milestone03',
      details:[
        { text:'Semana 5: Módulo de Mineração Interna (Filtros, Favoritos, 1-Click Funnel)', date:'01/08' },
        { text:'Semana 6: Biblioteca de Anúncios e Inspiração (Scraping Meta Ads, Moodboard)', date:'08/08' },
      ] },
    { phase:'Fase 4', weeks:'Semanas 7-8', range:'09/08 – 22/08', focus:'Prioridade 4: Tráfego e Métricas', milestone:'Meta Ads sincronizado e versão estável final lançada', slug:'milestone04',
      details:[
        { text:'Semana 7: Integração com Meta Ads (OAuth, API Marketing, Mapeamento)', date:'15/08' },
        { text:'Semana 8: Métricas Avançadas e Refinamento para SaaS (Dashboard Global, Gráficos, Code Review)', date:'22/08' },
      ] },
  ];

  function icon(name, extra){ return '<i data-lucide="'+name+'"'+(extra||'')+'></i>'; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmtDate(iso){
    try { return new Date(iso).toLocaleDateString('pt-BR', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
    catch(e){ return iso; }
  }

  async function api(path, opts){
    opts = opts || {};
    var r = await fetch('/api'+path, Object.assign({credentials:'include', headers:{'Content-Type':'application/json'}}, opts));
    if (r.status === 401) { showAuth(); throw new Error('unauth'); }
    var data = await r.json().catch(function(){ return {}; });
    if (!r.ok) throw new Error(data.error || 'Erro');
    return data;
  }

  function showAuth(){
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('app').classList.add('hidden');
    document.getElementById('authgate').classList.remove('hidden');
  }
  function showApp(){
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('authgate').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
  }

  document.getElementById('au-btn').addEventListener('click', submitLogin);
  document.getElementById('au-email').addEventListener('keydown', function(e){ if (e.key==='Enter') { e.preventDefault(); document.getElementById('au-pass').focus(); } });
  document.getElementById('au-pass').addEventListener('keydown', function(e){ if (e.key==='Enter') submitLogin(); });
  document.getElementById('au-pw-toggle').addEventListener('click', function(){
    var pw = document.getElementById('au-pass');
    pw.type = pw.type === 'password' ? 'text' : 'password';
    this.setAttribute('aria-label', pw.type === 'password' ? 'Mostrar senha' : 'Ocultar senha');
  });

  async function submitLogin(){
    var email = document.getElementById('au-email').value.trim();
    var pass = document.getElementById('au-pass').value;
    var errEl = document.getElementById('au-err');
    var btn = document.getElementById('au-btn');
    var label = document.getElementById('au-btn-label');
    errEl.textContent = '';
    if (!email || !pass) { errEl.textContent = 'Preencha email e senha.'; return; }
    btn.disabled = true;
    label.innerHTML = '<span class="spin-sm"></span>';
    try {
      var r = await fetch('/api/auth/login', { method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email:email, password:pass}) });
      var data = await r.json().catch(function(){ return {}; });
      if (!r.ok) { errEl.textContent = data.error || 'Falha ao entrar.'; btn.disabled = false; label.textContent = 'Entrar'; return; }
      location.href = 'https://offers.clubemkt.digital/milestones';
    } catch(e) { errEl.textContent = 'Falha ao entrar.'; btn.disabled = false; label.textContent = 'Entrar'; }
  }

  document.getElementById('signout-btn').addEventListener('click', async function(){
    await fetch('/api/auth/logout', { method:'POST', credentials:'include' }).catch(function(){});
    location.reload();
  });

  function renderIcons(){ if (window.lucide) window.lucide.createIcons(); }

  function reveal(){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: .1 });
    document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });
  }

  function roleBadge(role){
    var cls = role === 'owner' ? 'admin' : 'viewer';
    var label = role === 'owner' ? 'Admin' : 'Viewer';
    return '<span class="role-badge '+cls+'">'+label+'</span>';
  }

  function applyRole(me){
    document.getElementById('whoami').innerHTML = esc(me.email) + roleBadge(me.role);
    document.getElementById('dash-link').classList.toggle('hidden', me.role !== 'owner');
  }

  async function boot(){
    document.getElementById('loading').classList.remove('hidden');
    try {
      if (slug) await renderDetail(slug);
      else await renderOverview();
      showApp();
      renderIcons();
      reveal();
    } catch(e) {
      if (e.message !== 'unauth') {
        document.getElementById('content').innerHTML = '<p style="padding:60px 0;color:var(--danger)">'+esc(e.message)+'</p>';
        showApp();
      }
    }
  }

  async function renderOverview(){
    var data = await api('/milestones');
    STATE.isAdmin = data.isAdmin; STATE.me = data.me; STATE.milestones = data.results;
    applyRole(data.me);
    var totalAll = data.results.reduce(function(s,m){ return s + m.totalTasks; }, 0);
    var doneAll = data.results.reduce(function(s,m){ return s + m.doneTasks; }, 0);
    var pctAll = totalAll ? Math.round(doneAll/totalAll*100) : 0;
    var milestonesDone = data.results.filter(function(m){ return m.progress === 100; }).length;
    var kickoff = new Date(2026, 5, 28); // Sunday, June 28 2026 — see SCHEDULE below
    var daysIn = Math.max(0, Math.floor((Date.now() - kickoff.getTime()) / 86400000));

    function statTile(iconName, num, label){
      return '<div class="stat-tile reveal"><div class="ico">'+icon(iconName, ' width="17" height="17"')+'</div>'
        + '<div class="num">'+esc(String(num))+'</div><div class="lbl">'+esc(label)+'</div></div>';
    }
    var statsRow = '<div class="stats-row">'
      + statTile('flag', milestonesDone+'/4', 'Marcos concluídos')
      + statTile('check-circle-2', doneAll+'/'+totalAll, 'Tarefas concluídas')
      + statTile('calendar-days', daysIn, 'Dias desde o início')
      + '</div>';

    var cards = data.results.map(function(m, i){
      var done = m.progress === 100;
      return '<a class="card-link reveal'+(done?' done':'')+'" href="/milestones/'+esc(m.slug)+'">'
        + (done ? '<div class="done-ribbon">'+icon('check-circle-2', ' width="13" height="13"')+' Completo</div>' : '')
        + '<div class="card-top"><span class="card-num">0'+(i+1)+'</span><span class="card-ico">'+icon(m.icon||'flag')+'</span></div>'
        + '<div class="card-title">'+esc(m.title)+'</div>'
        + '<div class="card-timeline">'+icon('calendar')+esc(m.timeline||'')+'</div>'
        + '<div class="pbar'+(done?' done':'')+'"><div style="width:'+m.progress+'%"></div></div>'
        + '<div class="pmeta"><span>'+m.doneTasks+'/'+m.totalTasks+' tarefas</span><span class="ppct">'+m.progress+'%</span></div>'
        + '</a>';
    }).join('');

    var schedRows = SCHEDULE.map(function(row, i){
      var details = row.details.map(function(d){
        return '<div><span class="dtxt">'+icon('chevron-right', ' width="14" height="14"')+'<span>'+esc(d.text)+'</span></span><span class="ddate">'+icon('calendar-check-2', ' width="12" height="12"')+' Entrega '+esc(d.date)+'</span></div>';
      }).join('');
      return '<a class="sched-row reveal" href="/milestones/'+row.slug+'">'
        + '<div class="wk">'+esc(row.weeks)+'<small>'+esc(row.range)+'</small></div>'
        + '<div class="sched-body">'
        + '<div class="sched-head"><span class="sched-focus">'+esc(row.focus)+'</span><span class="sched-chip">'+esc(row.phase)+'</span></div>'
        + '<div class="sched-milestone">'+icon('flag', ' width="13" height="13"')+' '+esc(row.milestone)+'</div>'
        + '<div class="sched-details">'+details+'</div>'
        + '</div></a>';
    }).join('');

    document.getElementById('content').innerHTML =
      '<section class="sec">'
      + '<div class="sec-head reveal"><span class="eyebrow">Roadmap do projeto</span>'
      + '<h1>FunnelTone — <span class="gradient-text">Progresso do produto</span></h1>'
      + '<p>Progresso geral do desenvolvimento em 8 semanas.</p></div>'
      + '<div class="band reveal"><div class="bignum gradient-text">'+pctAll+'%</div>'
      + '<div class="bandbar"><div class="pbar'+(pctAll===100?' done':'')+'"><div style="width:'+pctAll+'%"></div></div></div>'
      + '<div class="bandmeta">'+doneAll+' / '+totalAll+' tarefas</div></div>'
      + statsRow
      + '<div class="cards">'+cards+'</div>'
      + '</section>'
      + '<section class="sec" id="cronograma">'
      + '<div class="sec-head reveal"><span class="eyebrow">Cronograma macro</span>'
      + '<h2>As <span class="gradient-text">8 semanas</span>, fase a fase.</h2>'
      + '<p>Sprint iniciado em 28 de junho de 2026 — cada fase liga direto à página correspondente, com a previsão de entrega de cada semana.</p></div>'
      + '<div class="sched">'+schedRows+'</div>'
      + '</section>';
  }

  async function renderDetail(slug){
    var data = await api('/milestones/'+encodeURIComponent(slug));
    STATE.isAdmin = data.isAdmin; STATE.me = data.me;
    applyRole(data.me);

    var idx = data.milestone.order_index;
    var m = data.milestone;

    var infogrid =
      '<div class="infogrid">'
      + '<div class="infobox"><div class="lbl">'+icon('calendar')+'Prazo</div><div class="val">'+esc(m.timeline||'')+'</div></div>'
      + '<div class="infobox"><div class="lbl">'+icon('target')+'Objetivo</div><div class="val">'+esc(m.objective||'')+'</div></div>'
      + '</div>';

    var catsHtml = data.categories.map(function(cat){
      var tasksHtml = cat.tasks.map(function(t){
        var clickable = STATE.isAdmin;
        return '<div class="task '+(t.done?'done':'')+' '+(clickable?'clickable':'')+'" '+(clickable?('data-task="'+t.id+'"'):'')+'>'
          + '<span class="chk">'+icon(t.done ? 'check-circle-2' : 'circle')+'</span>'
          + '<p>'+esc(t.title)+'</p>'
          + '</div>';
      }).join('');
      return '<div class="cat reveal"><h3>'+esc(cat.name)+'</h3>'+tasksHtml+'</div>';
    }).join('');

    var commentsHtml = data.comments.length
      ? data.comments.map(function(c){
          return '<div class="cmt"><div class="cmt-head"><span class="cmt-author">'+esc(c.user_email)+'</span><span class="cmt-date">'+fmtDate(c.created_at)+'</span></div><div class="cmt-body">'+esc(c.body)+'</div></div>';
        }).join('')
      : '<div class="cempty">Nenhum comentário ainda. Seja o primeiro a dar feedback.</div>';

    var prevSlug = idx > 1 ? 'milestone0'+(idx-1) : null;
    var nextSlug = idx < 4 ? 'milestone0'+(idx+1) : null;
    var navHtml = '<div class="mnav reveal">'
      + (prevSlug ? '<a href="/milestones/'+prevSlug+'"><small>Anterior</small>Fase 0'+(idx-1)+'</a>' : '<span></span>')
      + (nextSlug ? '<a class="next" href="/milestones/'+nextSlug+'"><small>Próximo</small>Fase 0'+(idx+1)+'</a>' : '<span></span>')
      + '</div>';

    var isDone = data.progress === 100;
    document.getElementById('content').innerHTML =
      '<section class="sec" style="padding-top:var(--s-6)">'
      + '<div class="hero reveal'+(isDone?' done':'')+'">'
      + '<div class="hero-grad">'
      + '<span class="badge eyebrow">Fase 0'+idx+' de 04'+(isDone?' · Concluída':'')+'</span>'
      + '<h1>'+esc(m.title)+'</h1>'
      + infogrid
      + '</div>'
      + '<div class="hero-progress"><div class="ring-pct'+(isDone?' done':'')+'">'+data.progress+'%</div><div class="pbar'+(isDone?' done':'')+'"><div style="width:'+data.progress+'%"></div></div><div class="count">'+data.doneTasks+'/'+data.totalTasks+'</div></div>'
      + '</div>'
      + catsHtml
      + '<div class="deliverable reveal">'+icon('award', ' width="26" height="26"')+'<div><h5>Entregável</h5><p>'+esc(m.deliverable||'')+'</p></div></div>'
      + navHtml
      + '<div class="comments reveal"><h3>'+icon('message-circle')+'Feedback &amp; Comentários</h3>'
      + '<div class="clist">'+commentsHtml+'</div>'
      + '<div class="cform"><textarea id="cmt-input" placeholder="Escreva um comentário ou feedback sobre esta fase..."></textarea>'
      + '<div class="row"><button class="btn btn-primary" id="cmt-submit">Enviar comentário</button></div></div>'
      + '</div>'
      + '</section>';

    if (STATE.isAdmin) {
      document.querySelectorAll('.task.clickable').forEach(function(el){
        el.addEventListener('click', function(){ toggleTask(el.getAttribute('data-task'), !el.classList.contains('done'), el); });
      });
    }
    document.getElementById('cmt-submit').addEventListener('click', function(){ submitComment(slug); });
  }

  async function toggleTask(taskId, done, el){
    el.style.opacity = '.5';
    try {
      await api('/milestones/tasks/'+encodeURIComponent(taskId), { method:'PATCH', body: JSON.stringify({done:done}) });
      await renderDetail(slug);
      renderIcons();
    } catch(e) {
      el.style.opacity = '';
      alert(e.message);
    }
  }

  async function submitComment(slug){
    var ta = document.getElementById('cmt-input');
    var btn = document.getElementById('cmt-submit');
    var body = ta.value.trim();
    if (!body) return;
    btn.disabled = true;
    try {
      await api('/milestones/'+encodeURIComponent(slug)+'/comments', { method:'POST', body: JSON.stringify({body:body}) });
      await renderDetail(slug);
      renderIcons();
    } catch(e) {
      alert(e.message);
    } finally {
      btn.disabled = false;
    }
  }

  boot();
})();
</script>
</body>
</html>
