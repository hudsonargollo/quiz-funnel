<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Milestones · Tektone Funnels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--on-surface);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
  .hidden{display:none!important}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:900px;margin:0 auto;padding:24px 20px 80px}

  /* ── Auth gate ── */
  #authgate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .authcard{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--outline);border-radius:var(--r-lg);padding:32px;box-shadow:var(--e-2,0 8px 30px rgba(0,0,0,.3))}
  .authcard .logo{width:44px;height:44px;border-radius:var(--r-sm);background:var(--brand-grad);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:var(--on-primary);margin-bottom:16px}
  .authcard h1{font-family:var(--font-display);font-size:22px;margin:0 0 4px}
  .authcard p.sub{color:var(--on-surface-muted);font-size:13px;margin:0 0 24px}
  .authcard label{display:block;font-size:12px;color:var(--on-surface-muted);margin:14px 0 6px}
  .authcard input{width:100%;padding:11px 12px;border-radius:var(--r-sm);border:1px solid var(--outline);background:var(--surface-2);color:var(--on-surface);font-size:14px}
  .authcard input:focus{outline:none;border-color:var(--brand)}
  .authcard .btn{width:100%;margin-top:20px;padding:12px;border:none;border-radius:var(--r-sm);background:var(--brand-grad);color:var(--on-primary);font-weight:600;font-size:14px}
  .autherr{color:var(--danger);font-size:12px;margin-top:10px;min-height:16px}

  /* ── Topbar ── */
  .topbar{position:sticky;top:0;z-index:5;background:var(--surface-glass);backdrop-filter:blur(10px);border-bottom:1px solid var(--outline)}
  .topbar .inner{max-width:900px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:15px}
  .brand .logo{width:26px;height:26px;border-radius:7px;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--on-primary)}
  .brand .sep{color:var(--on-surface-faint);font-weight:400}
  .topbar .spacer{flex:1}
  .topbar a.navlink{font-size:13px;color:var(--on-surface-muted);text-decoration:none;display:flex;align-items:center;gap:6px}
  .topbar a.navlink:hover{color:var(--on-surface)}
  .btn.ghost{background:transparent;border:1px solid var(--outline);color:var(--on-surface-muted);border-radius:var(--r-sm);padding:8px 14px;font-size:13px}
  .btn.ghost:hover{color:var(--on-surface);border-color:var(--outline-strong)}
  .whoami{font-size:12px;color:var(--on-surface-faint)}
  .role-badge{display:inline-block;padding:2px 8px;border-radius:var(--r-pill);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-left:6px}
  .role-badge.admin{background:rgba(0,174,239,.14);color:var(--brand-soft)}
  .role-badge.viewer{background:rgba(124,92,255,.14);color:var(--accent-soft)}

  /* ── Overview grid ── */
  .ovhead{padding:32px 0 20px}
  .ovhead h1{font-family:var(--font-display);font-size:var(--fs-h1);margin:0 0 6px}
  .ovhead p{color:var(--on-surface-muted);font-size:14px;margin:0}
  .cards{display:grid;grid-template-columns:1fr;gap:14px;margin-top:20px}
  @media(min-width:640px){.cards{grid-template-columns:1fr 1fr}}
  .card-link{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--outline);border-radius:var(--r-lg);padding:20px;transition:border-color var(--dur-2,.2s) var(--ease-standard),transform var(--dur-2,.2s) var(--ease-standard)}
  .card-link:hover{border-color:var(--outline-strong);transform:translateY(-2px)}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
  .card-num{font-family:var(--font-display);font-size:12px;color:var(--on-surface-faint);letter-spacing:.08em;text-transform:uppercase}
  .card-title{font-family:var(--font-display);font-size:17px;font-weight:600;margin:4px 0 8px}
  .card-timeline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--on-surface-muted);margin-bottom:14px}
  .pbar{height:6px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden}
  .pbar>div{height:100%;background:var(--brand-grad);border-radius:var(--r-pill)}
  .pmeta{display:flex;justify-content:space-between;font-size:11px;color:var(--on-surface-faint);margin-top:6px}
  .ppct{font-weight:700;color:var(--brand-soft)}

  /* ── Detail hero ── */
  .hero{background:var(--surface);border:1px solid var(--outline);border-radius:var(--r-xl);overflow:hidden;margin-top:24px}
  .hero-grad{padding:28px 26px;background:linear-gradient(160deg,var(--surface-3) 0%,var(--surface) 70%)}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--r-pill);border:1px solid rgba(0,174,239,.3);color:var(--brand-soft);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}
  .hero h1{font-family:var(--font-display);font-size:var(--fs-h1);margin:0 0 16px;line-height:1.15}
  .infogrid{display:grid;grid-template-columns:1fr;gap:10px}
  @media(min-width:640px){.infogrid{grid-template-columns:1fr 1fr}}
  .infobox{background:var(--surface-3);border:1px solid var(--outline);border-radius:var(--r-md);padding:12px 14px}
  .infobox .lbl{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--brand-soft);margin-bottom:4px}
  .infobox .val{font-size:13px;color:var(--on-surface-muted);line-height:1.5}
  .hero-progress{padding:18px 26px;border-top:1px solid var(--outline);display:flex;align-items:center;gap:16px}
  .ring-pct{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--brand-soft);min-width:64px}
  .hero-progress .pbar{flex:1}
  .hero-progress .count{font-size:12px;color:var(--on-surface-faint);white-space:nowrap}

  /* ── Task categories ── */
  .cat{margin-top:26px}
  .cat h3{font-size:14px;font-weight:600;color:var(--on-surface);border-bottom:1px solid var(--outline);padding-bottom:10px;margin:0 0 10px}
  .task{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-radius:var(--r-sm);border:1px solid transparent;margin-bottom:4px}
  .task.done{background:rgba(34,197,94,.06);border-color:rgba(34,197,94,.18)}
  .task:not(.done):hover{background:var(--surface-2)}
  .task .chk{flex-shrink:0;width:19px;height:19px;margin-top:1px;color:var(--on-surface-faint)}
  .task.done .chk{color:var(--success)}
  .task.clickable{cursor:pointer}
  .task p{margin:0;font-size:14px;color:var(--on-surface)}
  .task.done p{color:var(--on-surface-faint);text-decoration:line-through}

  /* ── Deliverable ── */
  .deliverable{margin-top:24px;background:var(--surface);border:1px solid rgba(0,174,239,.22);border-radius:var(--r-lg);padding:18px 20px;display:flex;gap:14px;align-items:flex-start}
  .deliverable svg{flex-shrink:0;color:var(--brand-soft);margin-top:2px}
  .deliverable h5{margin:0 0 4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--brand-soft)}
  .deliverable p{margin:0;font-size:14px;color:var(--on-surface)}

  /* ── Comments ── */
  .comments{margin-top:32px}
  .comments h3{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin:0 0 16px}
  .clist{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
  .cmt{background:var(--surface);border:1px solid var(--outline);border-radius:var(--r-md);padding:12px 14px}
  .cmt-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
  .cmt-author{font-size:12px;font-weight:700;color:var(--on-surface)}
  .cmt-date{font-size:11px;color:var(--on-surface-faint)}
  .cmt-body{font-size:13px;color:var(--on-surface-muted);white-space:pre-wrap;line-height:1.5}
  .cempty{font-size:13px;color:var(--on-surface-faint);padding:16px 0}
  .cform textarea{width:100%;min-height:80px;resize:vertical;background:var(--surface-2);border:1px solid var(--outline);border-radius:var(--r-md);padding:12px;color:var(--on-surface);font-family:inherit;font-size:13px}
  .cform textarea:focus{outline:none;border-color:var(--brand)}
  .cform .row{display:flex;justify-content:flex-end;margin-top:8px}
  .cform button{padding:9px 18px;border:none;border-radius:var(--r-sm);background:var(--brand-grad);color:var(--on-primary);font-weight:600;font-size:13px}
  .cform button:disabled{opacity:.5;cursor:default}

  /* ── Nav between milestones ── */
  .mnav{display:flex;justify-content:space-between;margin-top:32px;gap:12px}
  .mnav a{flex:1;display:block;text-decoration:none;background:var(--surface);border:1px solid var(--outline);border-radius:var(--r-md);padding:12px 14px;font-size:12px;color:var(--on-surface-muted)}
  .mnav a:hover{border-color:var(--outline-strong);color:var(--on-surface)}
  .mnav a.next{text-align:right}
  .mnav a small{display:block;color:var(--on-surface-faint);text-transform:uppercase;letter-spacing:.05em;font-size:10px;margin-bottom:2px}

  .spin{width:26px;height:26px;border:2px solid var(--outline);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:60px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="authgate" class="hidden">
  <div class="authcard">
    <div class="logo">T</div>
    <h1>Entrar</h1>
    <p class="sub">Acesso interno · Tektone Funnels Milestones</p>
    <label>Email</label>
    <input id="au-email" type="email" autocomplete="username" placeholder="voce@tektone.com.br">
    <label>Senha</label>
    <input id="au-pass" type="password" autocomplete="current-password">
    <button class="btn" id="au-btn">Entrar</button>
    <div class="autherr" id="au-err"></div>
  </div>
</div>

<div id="loading" class="spin"></div>

<div id="app" class="hidden">
  <div class="topbar"><div class="inner">
    <a class="brand" href="/milestones"><span class="logo">T</span>Tektone Funnels<span class="sep">/ Milestones</span></a>
    <div class="spacer"></div>
    <span class="whoami" id="whoami"></span>
    <a class="navlink" href="/admin">← Dashboard</a>
    <button class="btn ghost" id="signout-btn">Sair</button>
  </div></div>
  <div class="wrap" id="content"></div>
</div>

<script>
(function(){
  var slug = (location.pathname.replace(/\/+$/,'').split('/')[2]) || null;
  var STATE = { isAdmin:false, me:null, milestones:[] };

  function icon(name, extra){ return '<i data-lucide="'+name+'"'+(extra||'')+'></i>'; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmtDate(iso){
    try { return new Date(iso).toLocaleDateString('pt-BR', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
    catch(e){ return iso; }
  }

  async function api(path, opts){
    opts = opts || {};
    var r = await fetch('/api'+path, Object.assign({credentials:'include', headers:{'Content-Type':'application/json'}}, opts));
    if (r.status === 401) { showAuth(); throw new Error('unauth'); }
    var data = await r.json().catch(function(){ return {}; });
    if (!r.ok) throw new Error(data.error || 'Erro');
    return data;
  }

  function showAuth(){
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('app').classList.add('hidden');
    document.getElementById('authgate').classList.remove('hidden');
  }
  function showApp(){
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('authgate').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
  }

  document.getElementById('au-btn').addEventListener('click', submitLogin);
  document.getElementById('au-pass').addEventListener('keydown', function(e){ if (e.key==='Enter') submitLogin(); });

  async function submitLogin(){
    var email = document.getElementById('au-email').value.trim();
    var pass = document.getElementById('au-pass').value;
    var errEl = document.getElementById('au-err');
    errEl.textContent = '';
    if (!email || !pass) { errEl.textContent = 'Preencha email e senha.'; return; }
    try {
      var r = await fetch('/api/auth/login', { method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email:email, password:pass}) });
      var data = await r.json().catch(function(){ return {}; });
      if (!r.ok) { errEl.textContent = data.error || 'Falha ao entrar.'; return; }
      boot();
    } catch(e) { errEl.textContent = 'Falha ao entrar.'; }
  }

  document.getElementById('signout-btn').addEventListener('click', async function(){
    await fetch('/api/auth/logout', { method:'POST', credentials:'include' }).catch(function(){});
    location.reload();
  });

  function renderIcons(){ if (window.lucide) window.lucide.createIcons(); }

  function roleBadge(role){
    var cls = role === 'owner' ? 'admin' : 'viewer';
    var label = role === 'owner' ? 'Admin' : 'Viewer';
    return '<span class="role-badge '+cls+'">'+label+'</span>';
  }

  async function boot(){
    document.getElementById('loading').classList.remove('hidden');
    try {
      if (slug) await renderDetail(slug);
      else await renderOverview();
      showApp();
      renderIcons();
    } catch(e) {
      if (e.message !== 'unauth') {
        document.getElementById('content').innerHTML = '<p style="padding:40px 0;color:var(--danger)">'+esc(e.message)+'</p>';
        showApp();
      }
    }
  }

  async function renderOverview(){
    var data = await api('/milestones');
    STATE.isAdmin = data.isAdmin; STATE.me = data.me; STATE.milestones = data.results;
    document.getElementById('whoami').innerHTML = esc(data.me.email) + roleBadge(data.me.role);
    var totalAll = data.results.reduce(function(s,m){ return s + m.totalTasks; }, 0);
    var doneAll = data.results.reduce(function(s,m){ return s + m.doneTasks; }, 0);
    var pctAll = totalAll ? Math.round(doneAll/totalAll*100) : 0;

    var cards = data.results.map(function(m, i){
      return '<a class="card-link" href="/milestones/'+esc(m.slug)+'">'
        + '<div class="card-top"><span class="card-num">Marco 0'+(i+1)+'</span>'+icon(m.icon||'flag','')+'</div>'
        + '<div class="card-title">'+esc(m.title)+'</div>'
        + '<div class="card-timeline">'+icon('calendar')+esc(m.timeline||'')+'</div>'
        + '<div class="pbar"><div style="width:'+m.progress+'%"></div></div>'
        + '<div class="pmeta"><span>'+m.doneTasks+'/'+m.totalTasks+' tarefas</span><span class="ppct">'+m.progress+'%</span></div>'
        + '</a>';
    }).join('');

    document.getElementById('content').innerHTML =
      '<div class="ovhead"><h1>Roadmap Tektone Funnels</h1>'
      + '<p>Progresso geral: <b style="color:var(--brand-soft)">'+pctAll+'%</b> ('+doneAll+'/'+totalAll+' tarefas concluídas)</p></div>'
      + '<div class="cards">'+cards+'</div>';
  }

  async function renderDetail(slug){
    var data = await api('/milestones/'+encodeURIComponent(slug));
    STATE.isAdmin = data.isAdmin; STATE.me = data.me;
    document.getElementById('whoami').innerHTML = esc(data.me.email) + roleBadge(data.me.role);

    var idx = data.milestone.order_index;
    var m = data.milestone;

    var infogrid =
      '<div class="infogrid">'
      + '<div class="infobox"><div class="lbl">'+icon('calendar')+'Prazo</div><div class="val">'+esc(m.timeline||'')+'</div></div>'
      + '<div class="infobox"><div class="lbl">'+icon('target')+'Objetivo</div><div class="val">'+esc(m.objective||'')+'</div></div>'
      + '</div>';

    var catsHtml = data.categories.map(function(cat){
      var tasksHtml = cat.tasks.map(function(t){
        var clickable = STATE.isAdmin;
        return '<div class="task '+(t.done?'done':'')+' '+(clickable?'clickable':'')+'" '+(clickable?('data-task="'+t.id+'"'):'')+'>'
          + '<span class="chk">'+icon(t.done ? 'check-circle-2' : 'circle')+'</span>'
          + '<p>'+esc(t.title)+'</p>'
          + '</div>';
      }).join('');
      return '<div class="cat"><h3>'+esc(cat.name)+'</h3>'+tasksHtml+'</div>';
    }).join('');

    var commentsHtml = data.comments.length
      ? data.comments.map(function(c){
          return '<div class="cmt"><div class="cmt-head"><span class="cmt-author">'+esc(c.user_email)+'</span><span class="cmt-date">'+fmtDate(c.created_at)+'</span></div><div class="cmt-body">'+esc(c.body)+'</div></div>';
        }).join('')
      : '<div class="cempty">Nenhum comentário ainda. Seja o primeiro a dar feedback.</div>';

    var prevSlug = idx > 1 ? 'milestone0'+(idx-1) : null;
    var nextSlug = idx < 4 ? 'milestone0'+(idx+1) : null;
    var navHtml = '<div class="mnav">'
      + (prevSlug ? '<a href="/milestones/'+prevSlug+'"><small>Anterior</small>Marco 0'+(idx-1)+'</a>' : '<span></span>')
      + (nextSlug ? '<a class="next" href="/milestones/'+nextSlug+'"><small>Próximo</small>Marco 0'+(idx+1)+'</a>' : '<span></span>')
      + '</div>';

    document.getElementById('content').innerHTML =
      '<div class="hero">'
      + '<div class="hero-grad">'
      + '<span class="badge">Marco 0'+idx+' de 04</span>'
      + '<h1>'+esc(m.title)+'</h1>'
      + infogrid
      + '</div>'
      + '<div class="hero-progress"><div class="ring-pct">'+data.progress+'%</div><div class="pbar"><div style="width:'+data.progress+'%"></div></div><div class="count">'+data.doneTasks+'/'+data.totalTasks+'</div></div>'
      + '</div>'
      + catsHtml
      + '<div class="deliverable">'+icon('award', ' width="26" height="26"')+'<div><h5>Entregável</h5><p>'+esc(m.deliverable||'')+'</p></div></div>'
      + navHtml
      + '<div class="comments"><h3>'+icon('message-circle')+'Feedback &amp; Comentários</h3>'
      + '<div class="clist">'+commentsHtml+'</div>'
      + '<div class="cform"><textarea id="cmt-input" placeholder="Escreva um comentário ou feedback sobre este marco..."></textarea>'
      + '<div class="row"><button id="cmt-submit">Enviar comentário</button></div></div>'
      + '</div>';

    if (STATE.isAdmin) {
      document.querySelectorAll('.task.clickable').forEach(function(el){
        el.addEventListener('click', function(){ toggleTask(el.getAttribute('data-task'), !el.classList.contains('done'), el); });
      });
    }
    document.getElementById('cmt-submit').addEventListener('click', function(){ submitComment(slug); });
  }

  async function toggleTask(taskId, done, el){
    el.style.opacity = '.5';
    try {
      await api('/milestones/tasks/'+encodeURIComponent(taskId), { method:'PATCH', body: JSON.stringify({done:done}) });
      await renderDetail(slug);
      renderIcons();
    } catch(e) {
      el.style.opacity = '';
      alert(e.message);
    }
  }

  async function submitComment(slug){
    var ta = document.getElementById('cmt-input');
    var btn = document.getElementById('cmt-submit');
    var body = ta.value.trim();
    if (!body) return;
    btn.disabled = true;
    try {
      await api('/milestones/'+encodeURIComponent(slug)+'/comments', { method:'POST', body: JSON.stringify({body:body}) });
      await renderDetail(slug);
      renderIcons();
    } catch(e) {
      alert(e.message);
    } finally {
      btn.disabled = false;
    }
  }

  boot();
})();
</script>
</body>
</html>
